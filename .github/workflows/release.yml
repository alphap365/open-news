# Manual release workflow:
# validate → build sdist → optionally obtain dependency bundle → draft release.
#
# Open News wheels are published through PyPI, not attached to GitHub Releases.
# Dependency wheels are supplementary third-party artifacts.
# Nothing is published to a package index here.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version from pyproject.toml, e.g. 1.1.0 or 1.1.0a1"
        required: true
        type: string

      include_dependency_wheels:
        description: "Attach a dependency-wheels.zip from a previous build.yml run"
        required: false
        default: false
        type: boolean

      dependency_build_run_id:
        description: "GitHub Actions run ID of the Build Dependency Wheels workflow"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # Validate release version
  # ------------------------------------------------------------

  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging
        run: python -m pip install packaging

      - name: Validate version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)

          pyproject_version = project["project"]["version"]
          input_version = os.environ["INPUT_VERSION"]

          try:
              expected = Version(pyproject_version)
              supplied = Version(input_version)
          except InvalidVersion as exc:
              sys.exit(f"Invalid version: {exc}")

          if expected != supplied:
              sys.exit(
                  f"Version mismatch: pyproject.toml={pyproject_version!r}, "
                  f"input={input_version!r}"
              )

          tag = f"v{pyproject_version}"
          prerelease = expected.is_prerelease or expected.is_devrelease

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={pyproject_version}\n")
              output.write(f"tag={tag}\n")
              output.write(
                  f"is_prerelease={'true' if prerelease else 'false'}\n"
              )

          print(f"Validated version: {pyproject_version}")
          print(f"Release tag: {tag}")
          PY

      - name: Validate dependency build run input
        if: inputs.include_dependency_wheels
        env:
          RUN_ID: ${{ inputs.dependency_build_run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "A dependency_build_run_id is required when dependency wheels are enabled."
            exit 1
          fi

          case "$RUN_ID" in
            *[!0-9]*)
              echo "The dependency build run ID must be numeric."
              exit 1
              ;;
          esac

  # ------------------------------------------------------------
  # Build only the Open News source distribution
  # ------------------------------------------------------------

  package:
    name: Build Open News source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build source distribution only
        run: uv build --sdist

      - name: Validate source distribution metadata
        run: |
          uv run --with twine twine check dist/*.tar.gz

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------
  # Retrieve dependency bundle from a separate build.yml run
  # ------------------------------------------------------------

  dependency-bundle:
    name: Obtain dependency wheel bundle
    needs: validate

    if: inputs.include_dependency_wheels

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download dependency bundle from build workflow
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.dependency_build_run_id }}
          name: dependency-wheels
          path: dependency-bundle

      - name: Validate bundle files
        run: |
          test -s dependency-bundle/dependency-wheels.zip
          test -s dependency-bundle/manifest.json
          test -s dependency-bundle/MANIFEST.txt

      - name: Verify bundle project version
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          manifest = json.loads(
              pathlib.Path("dependency-bundle/manifest.json").read_text()
          )

          expected = os.environ["RELEASE_VERSION"]
          actual = manifest.get("project_version")

          if actual != expected:
              sys.exit(
                  f"Dependency bundle version mismatch: "
                  f"bundle={actual!r}, release={expected!r}"
              )

          print(f"Dependency bundle matches Open News {expected}.")
          PY

      - name: Upload validated dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-dependency-bundle
          path: dependency-bundle/
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------
  # Create or update the GitHub draft release
  # ------------------------------------------------------------

  create-release:
    name: Create GitHub draft release
    needs:
      - validate
      - package
      - dependency-bundle

    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.package.result == 'success' &&
      (
        needs.dependency-bundle.result == 'success' ||
        needs.dependency-bundle.result == 'skipped'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: release-assets

      - name: Download dependency bundle
        if: inputs.include_dependency_wheels
        uses: actions/download-artifact@v4
        with:
          name: release-dependency-bundle
          path: release-assets/dependencies

      - name: Create release tag if missing
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
          else
            args=(
              "$TAG"
              --repo "$GITHUB_REPOSITORY"
              --draft
              --title "Open News v${VERSION}"
              --notes "Open News v${VERSION}"
            )

            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi

            gh release create "${args[@]}"
          fi

      - name: Upload source distribution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            release-assets/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload dependency bundle
        if: inputs.include_dependency_wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            release-assets/dependencies/dependency-wheels.zip \
            release-assets/dependencies/manifest.json \
            release-assets/dependencies/MANIFEST.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber