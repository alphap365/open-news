name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version from pyproject.toml, e.g. 1.1.0 or 1.1.0a1"
        required: true
        type: string

      include_dependency_wheels:
        description: "Run Build Dependency Wheels and attach the resulting bundles"
        required: false
        default: false
        type: boolean

      android_api_level:
        description: "Android minimum API level (passed to Build Dependency Wheels)"
        required: false
        default: "24"
        type: choice
        options: ["21", "23", "24", "26", "28", "29", "30", "31", "32", "33", "34", "35"]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:

  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging

      - name: Validate version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from packaging.version import InvalidVersion, Version
          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)
          pyproject_version = project["project"]["version"]
          input_version = os.environ["INPUT_VERSION"]
          try:
              expected = Version(pyproject_version)
              supplied = Version(input_version)
          except InvalidVersion as exc:
              sys.exit(f"Invalid version: {exc}")
          if expected != supplied:
              sys.exit(
                  f"Version mismatch: pyproject.toml={pyproject_version!r}, "
                  f"input={input_version!r}"
              )
          tag = f"v{pyproject_version}"
          prerelease = expected.is_prerelease or expected.is_devrelease
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={pyproject_version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"is_prerelease={'true' if prerelease else 'false'}\n")
          print(f"Validated version: {pyproject_version}")
          print(f"Release tag: {tag}")
          PY


  package:
    name: Build Open News source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Build source distribution only
        run: uv build --sdist

      - name: Validate source distribution metadata
        run: uv run --with twine twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30


  build-dependencies:
    name: Build dependency wheels
    needs: validate
    if: inputs.include_dependency_wheels
    uses: ./.github/workflows/build.yml
    with:
      android_api_level: ${{ inputs.android_api_level }}
      fail_on_deferred: false


  create-release:
    name: Create GitHub draft release
    needs: [validate, package, build-dependencies]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.build-dependencies.result == 'success' ||
       needs.build-dependencies.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: release-assets

      - name: Download dependency-wheels bundle
        if: inputs.include_dependency_wheels
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dependency-wheels
          path: release-assets/dependencies

      - name: Download dependency-wheels-prebuilt bundle
        if: inputs.include_dependency_wheels
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dependency-wheels-prebuilt
          path: release-assets/prebuilt

      - name: List release assets
        run: |
          echo "Source distribution:"
          ls -la release-assets/*.tar.gz 2>/dev/null || true
          echo "Built dependency bundle:"
          ls -la release-assets/dependencies/*.zip 2>/dev/null || true
          echo "Prebuilt dependency bundle:"
          ls -la release-assets/prebuilt/*.zip 2>/dev/null || true

      - name: Create release tag if missing
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
          else
            args=(
              "$TAG"
              --repo "$GITHUB_REPOSITORY"
              --draft
              --title "Open News v${VERSION}"
              --notes "Open News v${VERSION}"
            )
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

      - name: Upload source distribution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            release-assets/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload dependency-wheels bundle
        if: inputs.include_dependency_wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if [ -f release-assets/dependencies/dependency-wheels.zip ]; then
            gh release upload "$TAG" \
              release-assets/dependencies/dependency-wheels.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "::notice::No dependency-wheels.zip was produced (all deps covered by PyPI)."
          fi

      - name: Upload dependency-wheels-prebuilt bundle
        if: inputs.include_dependency_wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if [ -f release-assets/prebuilt/dependency-wheels-prebuilt.zip ]; then
            gh release upload "$TAG" \
              release-assets/prebuilt/dependency-wheels-prebuilt.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "::notice::No dependency-wheels-prebuilt.zip was produced (no external wheels found)."
          fi