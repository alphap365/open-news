name: Test Android wheel build

on:
  workflow_dispatch:

jobs:
  matrix-gen:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      has_gaps: ${{ steps.gen.outputs.has_gaps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Compute wheel gaps
        id: gen
        run: python .github/scripts/compute_wheel_gaps.py

  build:
    needs: matrix-gen
    if: needs.matrix-gen.outputs.has_gaps == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-gen.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A known-broken package (e.g. lxml's current Android cross-compile gap)
    # shouldn't take down the whole matrix — let each leg fail independently.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sdist (generic — works for any package/version)
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          pkg = "${{ matrix.package }}"
          version = "${{ matrix.version }}"
          data = json.load(urllib.request.urlopen(
              f"https://pypi.org/pypi/{pkg}/{version}/json"
          ))
          sdist = next(u for u in data["urls"] if u["packagetype"] == "sdist")
          print(sdist["url"])
          with open("sdist_url.txt", "w") as f:
              f.write(sdist["url"])
          EOF

          URL=$(cat sdist_url.txt)
          echo "Fetching: $URL"
          curl -L -o src_archive "$URL"

          mkdir -p pkgsrc
          case "$URL" in
            *.tar.gz|*.tgz)
              tar xf src_archive -C pkgsrc --strip-components=1 ;;
            *.zip)
              mkdir -p pkgsrc_tmp
              unzip -q src_archive -d pkgsrc_tmp
              mv pkgsrc_tmp/*/* pkgsrc/ ;;
            *)
              echo "Unrecognized sdist archive type: $URL" >&2
              exit 1 ;;
          esac
        shell: bash

      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: pkgsrc
        env:
          CIBW_PLATFORM: ${{ matrix.cibw_platform }}
          CIBW_BUILD: ${{ matrix.cibw_build_id }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.cibw_build_id }}-${{ matrix.cibw_archs }}
          path: wheelhouse/*.whl
          if-no-files-found: warn