name: Test Android wheel build

on:
  workflow_dispatch:

jobs:
  matrix-gen:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      has_gaps: ${{ steps.gen.outputs.has_gaps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Compute wheel gaps
        id: gen
        run: python .github/scripts/compute_wheel_gaps.py

  build-lxml-only:
    needs: matrix-gen
    if: needs.matrix-gen.outputs.has_gaps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch lxml sdist
        run: |
          curl -L -o src.tar.gz https://files.pythonhosted.org/packages/23/ad/28ecd7cb894d172f3c9c80a075eeeb2017ac62e3632cee05a5f9493547eb/lxml-6.1.3.tar.gz
          mkdir -p pkgsrc
          tar xf src.tar.gz -C pkgsrc --strip-components=1

      # 1. Provide JDK (Mandatory for Android CLI tool parsing)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Call the explicit path to the modern cmdline-tools binary
      - name: Install Android NDK via exact path
        run: |
          yes | ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      # 3. Build the wheel via cibuildwheel v3.1+
      - uses: pypa/cibuildwheel@v3.1
        with:
          package-dir: pkgsrc
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: arm64_v8a
          # Forward the actual local NDK path directly down into the build wrapper
          CIBW_ENVIRONMENT: ANDROID_NDK_HOME=${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - uses: actions/upload-artifact@v4
        with:
          name: lxml-android-wheel
          path: wheelhouse/*.whl
