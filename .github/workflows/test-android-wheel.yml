name: Test Android wheel build

on:
  workflow_dispatch:

jobs:
  matrix-gen:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      has_gaps: ${{ steps.gen.outputs.has_gaps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Compute wheel gaps
        id: gen
        run: python .github/scripts/compute_wheel_gaps.py

  build-lxml-only:
    needs: matrix-gen
    if: needs.matrix-gen.outputs.has_gaps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch lxml sdist
        run: |
          curl -L -o src.tar.gz https://pythonhosted.org
          mkdir -p pkgsrc
          tar xf src.tar.gz -C pkgsrc --strip-components=1

      # 1. Provide JDK (Mandatory for sdkmanager execution)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Use a modern, stable SDK installer
      - name: Install Android Platforms and NDK
        uses: malinskiy/action-android/install-sdk@v1
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973

      # 3. Compile the wheel via cibuildwheel v3.1+
      - uses: pypa/cibuildwheel@v3.1
        with:
          package-dir: pkgsrc
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: arm64_v8a
          # Point cibuildwheel directly to the NDK installed by the action
          CIBW_ENVIRONMENT: ANDROID_NDK_HOME=${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - uses: actions/upload-artifact@v4
        with:
          name: lxml-android-wheel
          path: wheelhouse/*.whl
