name: Test Android wheel build

on:
  workflow_dispatch:

jobs:
  matrix-gen:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      has_gaps: ${{ steps.gen.outputs.has_gaps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Compute wheel gaps
        id: gen
        run: python .github/scripts/compute_wheel_gaps.py

  build-lxml-only:
    needs: matrix-gen
    if: needs.matrix-gen.outputs.has_gaps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch lxml sdist
        run: |
          python -m pip download --no-deps -d src "lxml==6.1.3" --no-binary :all:
          mkdir -p pkgsrc
          cd src && tar xf lxml-6.1.3.tar.gz -C ../pkgsrc --strip-components=1

      - uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: pkgsrc
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: arm64_v8a

      - uses: actions/upload-artifact@v4
        with:
          name: lxml-android-wheel
          path: wheelhouse/*.whl