name: Publish prerelease to TestPyPI

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Exact prerelease version in pyproject.toml, e.g. 1.1.0a1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate selected tag and prerelease version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Refusing to publish: select the exact prerelease Git tag in the Run workflow ref selector." >&2
            exit 1
          fi
          case "$REF_NAME" in
            v*) ;;
            *) echo "Refusing to publish: tag must begin with v (received $REF_NAME)." >&2; exit 1 ;;
          esac

      - name: Check out selected tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install version parser
        run: python -m pip install packaging

      - name: Validate version and release channel
        id: validate
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          REF_NAME: ${{ github.ref_name }}
        run: python .github/scripts/validate_release.py --version "$CONFIRM_VERSION" --tag "$REF_NAME" --channel testpypi

  tests:
    name: Run required test matrix
    needs: validate-release
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and verify release artifacts
    needs: validate-release
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish verified artifacts to TestPyPI
    needs: [validate-release, tests, build]
    if: ${{ needs.validate-release.result == 'success' && needs.tests.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/open-news-api
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions built by the verified build job
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Recheck distribution metadata
        run: python -m pip install --upgrade twine && python -m twine check dist/*

      - name: Publish to TestPyPI only
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
