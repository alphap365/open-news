name: Build dependency wheels

on:
  workflow_dispatch:
  push:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/build-dep-wheels.yml"
  schedule:
    - cron: "0 3 1 * *"

jobs:
  # ------------------------------------------------------------------
  # 0. Read the version once, from the one place it's actually defined
  # ------------------------------------------------------------------
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from pyproject.toml
        id: get
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=wheelhouse-v$v" >> "$GITHUB_OUTPUT"

  matrix-gen:
    needs: read-version
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_gaps: ${{ steps.filter.outputs.has_gaps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Compute wheel gaps
        id: gen
        run: python .github/scripts/compute_wheel_gaps.py

      # Packages we build by hand (Android cross-compile gaps, custom
      # patches, etc.) shouldn't reach the matrix at all — the manual
      # install script owns them.
      - name: Exclude manually-handled packages
        id: filter
        env:
          MATRIX_IN: ${{ steps.gen.outputs.matrix }}
        run: |
          python3 - <<'EOF'
          import json, os

          matrix = json.loads(os.environ["MATRIX_IN"])
          EXCLUDE = {"lxml"}  # handled by the install script, not here
          matrix = [m for m in matrix if m["package"].lower() not in EXCLUDE]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"has_gaps={'true' if matrix else 'false'}\n")

          print(f"After exclusion: {len(matrix)} combinations remain.")
          for m in matrix:
              print(" -", m)
          EOF

  build:
    needs: matrix-gen
    if: needs.matrix-gen.outputs.has_gaps == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-gen.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A known-broken package (e.g. lxml's Android cross-compile gap) shouldn't
    # take down the whole matrix — let each leg fail independently.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sdist (generic — works for any package/version)
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          pkg = "${{ matrix.package }}"
          version = "${{ matrix.version }}"
          data = json.load(urllib.request.urlopen(
              f"https://pypi.org/pypi/{pkg}/{version}/json"
          ))
          sdist = next(u for u in data["urls"] if u["packagetype"] == "sdist")
          print(sdist["url"])
          with open("sdist_url.txt", "w") as f:
              f.write(sdist["url"])
          EOF

          URL=$(cat sdist_url.txt)
          echo "Fetching: $URL"
          curl -L -o src_archive "$URL"

          mkdir -p pkgsrc
          case "$URL" in
            *.tar.gz|*.tgz)
              tar xf src_archive -C pkgsrc --strip-components=1 ;;
            *.zip)
              mkdir -p pkgsrc_tmp
              unzip -q src_archive -d pkgsrc_tmp
              mv pkgsrc_tmp/*/* pkgsrc/ ;;
            *)
              echo "Unrecognized sdist archive type: $URL" >&2
              exit 1 ;;
          esac
        shell: bash

      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: pkgsrc
        env:
          CIBW_PLATFORM: ${{ matrix.cibw_platform }}
          CIBW_BUILD: ${{ matrix.cibw_build_id }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.cibw_platform }}-${{ matrix.cibw_archs }}-${{ matrix.py_tag }}
          path: wheelhouse/*.whl
          if-no-files-found: warn

  verify-metadata:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-wheels
      - name: Check wheel filenames are well-formed
        run: |
          pip install check-wheel-contents --quiet
          find all-wheels -name "*.whl" -exec check-wheel-contents {} \; || true

  publish:
    needs: [read-version, build, verify-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-wheels
      - name: Flatten artifact dirs
        run: |
          mkdir -p release-wheels
          find all-wheels -name "*.whl" -exec cp {} release-wheels/ \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.read-version.outputs.tag }}
          name: "Dependency wheels for v${{ needs.read-version.outputs.version }}"
          files: release-wheels/*.whl
          fail_on_unmatched_files: true