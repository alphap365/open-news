name: Tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q --junitxml=test-results.xml

      - name: Compile package
        if: always()
        run: |
          if [ -d src/open_news ]; then
            package_dir="src/open_news"
          else
            package_dir="open_news"
          fi
          uv run --locked --python ${{ matrix.python-version }} python -m compileall -q "$package_dir"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
