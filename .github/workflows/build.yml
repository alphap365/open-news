name: Build Dependency Wheels

on:
  workflow_dispatch:
    inputs:
      android_api_level:
        description: Android minimum API level
        required: true
        default: "24"
        type: choice
        options: ["21", "23", "24", "26", "28", "29", "30", "31", "32", "33", "34", "35"]
      fail_on_deferred:
        description: Fail the workflow if some wheel combinations cannot be planned
        required: true
        default: false
        type: boolean

  workflow_call:
    inputs:
      android_api_level:
        description: Android minimum API level
        required: false
        default: "24"
        type: string
      fail_on_deferred:
        description: Fail the workflow if some wheel combinations cannot be planned
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  ANDROID_API_LEVEL: ${{ inputs.android_api_level }}

jobs:

  # ------------------------------------------------------------------
  # Plan: three-tier recipe resolution + matrix generation
  # ------------------------------------------------------------------
  plan:
    name: Discover and plan wheel builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      build_count: ${{ steps.plan.outputs.build_count }}
      rejected_count: ${{ steps.plan.outputs.rejected_count }}
      has_prebuilt: ${{ steps.plan.outputs.prebuilt_count != '0' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install discovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "packaging>=25.0" "pyyaml>=6.0"

      - name: Discover missing wheels (three-tier recipe resolution)
        id: plan
        run: |
          python .github/scripts/plan_wheels.py \
            --output wheel-gaps.json \
            --plan-output wheel-build-plan.json \
            --discovery-output wheel-gaps-discovery.json \
            --android-api-level "$ANDROID_API_LEVEL" \
            --download-dir prebuilt_wheels

      - name: Display build plan
        env:
          BUILD_COUNT: ${{ steps.plan.outputs.build_count }}
          REJECTED_COUNT: ${{ steps.plan.outputs.rejected_count }}
          PREBUILT_COUNT: ${{ steps.plan.outputs.prebuilt_count }}
        run: |
          echo "Build jobs: ${BUILD_COUNT:-0}"
          echo "Prebuilt (external, downloaded): ${PREBUILT_COUNT:-0}"
          echo "Rejected/deferred: ${REJECTED_COUNT:-0}"
          if [ -f wheel-build-plan.json ]; then
            python -m json.tool wheel-build-plan.json
          fi

      - name: Upload prebuilt external wheels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-wheels
          path: prebuilt_wheels/*.whl
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload discovery and planning reports
        uses: actions/upload-artifact@v4
        with:
          name: wheel-build-metadata
          path: |
            wheel-gaps.json
            wheel-gaps-discovery.json
            wheel-build-plan.json
          if-no-files-found: error
          retention-days: 30


  # ------------------------------------------------------------------
  # Build: pure Python (pip wheel) or native (cibuildwheel)
  # ------------------------------------------------------------------
  build:
    name: >-
      ${{ matrix.package }} ${{ matrix.version }}
      / ${{ matrix.target }}
      / ${{ matrix.cibw_build }}
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The ubuntu-latest runner image ships with the Android SDK and NDK
      # pre-installed, and cibuildwheel finds them via ANDROID_HOME (already
      # exported by the runner). We only verify they exist — no install step,
      # no override of ANDROID_HOME/ANDROID_NDK_HOME. This matches the older
      # release workflow that successfully built Android wheels.
      - name: Verify Android SDK is available
        if: matrix.cibw_platform == 'android' && matrix.build_type == 'cibuildwheel'
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          if [ ! -d "${ANDROID_HOME}/ndk" ]; then
            echo "::error::No NDK directory at ${ANDROID_HOME}/ndk/"
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "Available NDK versions:"
          ls -la "${ANDROID_HOME}/ndk/" || true

      - name: Set up QEMU (aarch64 fallback)
        if: matrix.cibw_platform == 'linux' && matrix.cibw_archs == 'aarch64' && matrix.runner == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download and prepare source distribution
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile, urllib.request, zipfile, stat
          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          source_url = os.environ.get("SOURCE_URL", "").strip()
          expected_sha256 = os.environ.get("SOURCE_SHA256", "").strip()
          if not source_url:
              api = f"https://pypi.org/pypi/{package}/{version}/json"
              req = urllib.request.Request(api, headers={"User-Agent": "open-news-wheel-builder/1.5"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              sdists = [i for i in data.get("urls", []) if i.get("packagetype") == "sdist"]
              if not sdists:
                  raise RuntimeError(f"No sdist for {package}=={version}")
              selected = sdists[0]
              source_url = selected["url"]
              expected_sha256 = expected_sha256 or selected.get("digests", {}).get("sha256", "")
          archive = pathlib.Path("source-archive")
          req = urllib.request.Request(source_url, headers={"User-Agent": "open-news-wheel-builder/1.5"})
          with urllib.request.urlopen(req, timeout=180) as response:
              archive.write_bytes(response.read())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if expected_sha256 and digest.lower() != expected_sha256.lower():
              raise RuntimeError(f"SHA-256 mismatch for {package}=={version}")
          extracted = pathlib.Path("source-extracted")
          extracted.mkdir()
          if tarfile.is_tarfile(archive):
              with tarfile.open(archive) as tar:
                  tar.extractall(extracted, filter="data")
          elif zipfile.is_zipfile(archive):
              with zipfile.ZipFile(archive) as zf:
                  for item in zf.infolist():
                      name = pathlib.PurePosixPath(item.filename)
                      if name.is_absolute() or ".." in name.parts:
                          raise RuntimeError(f"Unsafe ZIP path: {item.filename}")
                      if stat.S_ISLNK(item.external_attr >> 16):
                          raise RuntimeError(f"Symlink in source: {item.filename}")
                  zf.extractall(extracted)
          else:
              raise RuntimeError("Unsupported source archive format")
          entries = list(extracted.iterdir())
          source = entries[0] if len(entries) == 1 and entries[0].is_dir() else extracted
          if not ((source / "pyproject.toml").is_file() or (source / "setup.py").is_file() or (source / "setup.cfg").is_file()):
              raise RuntimeError("Extracted source has no recognizable Python project.")
          shutil.copytree(source, pathlib.Path("pkgsrc"), dirs_exist_ok=True)
          print(f"Prepared {package}=={version}")
          PY

      - name: Strip dependency [tool.cibuildwheel] config
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, re, sys

          p = pathlib.Path("pkgsrc/pyproject.toml")
          if not p.exists():
              print("No pkgsrc/pyproject.toml — nothing to patch.")
              sys.exit(0)

          original = p.read_text(encoding="utf-8")
          text, n = re.subn(
              r'(?ms)^\[tool\.cibuildwheel(?:\.[^\]]+)*\][^\n]*\n.*?(?=^\[|\Z)',
              '',
              original,
          )
          if text != original:
              p.write_text(text, encoding="utf-8")
              print(f"Removed {n} [tool.cibuildwheel*] section(s) from {p}")
          else:
              print(f"No [tool.cibuildwheel*] sections found in {p}")
          EOF

      - name: Materialize recipe host artifacts
        if: matrix.host_requirements_json != '' && matrix.host_requirements_json != '[]'
        shell: bash
        env:
          HOST_REQS: ${{ matrix.host_requirements_json }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.request
          reqs = json.loads(os.environ["HOST_REQS"] or "[]")
          base = "/opt/recipe"
          os.makedirs(base, exist_ok=True)
          for req in reqs:
              if not req.get("required"):
                  print(f"skip optional: {req['name']}")
                  continue
              url = req.get("artifact_url")
              if not url:
                  continue
              name = req["name"]
              dest = os.path.join(base, name)
              if os.path.isdir(dest):
                  print(f"already materialized: {name}")
                  continue
              archive = f"/tmp/{name}.tar.gz"
              print(f"fetching {name} from {url}")
              try:
                  urllib.request.urlretrieve(url, archive)
                  os.makedirs(dest, exist_ok=True)
                  subprocess.run(
                      ["tar", "xzf", archive, "-C", dest, "--strip-components=1"],
                      check=True,
                  )
              except Exception as exc:
                  print(f"WARN: failed to materialize {name}: {exc}", file=sys.stderr)
          PY

      - name: Apply recipe patches
        if: matrix.patches_json != '' && matrix.patches_json != '[]'
        shell: bash
        env:
          PATCHES: ${{ matrix.patches_json }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile, urllib.request
          patches = json.loads(os.environ["PATCHES"] or "[]")
          for patch in patches:
              url = patch.get("url")
              if not url:
                  continue
              print(f"trying {patch.get('filename')}")
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      if r.status != 200:
                          continue
                      content = r.read()
              except Exception:
                  continue
              with tempfile.NamedTemporaryFile(delete=False, suffix=".patch") as f:
                  f.write(content)
                  pfile = f.name
              result = subprocess.run(
                  ["patch", "-p1", "-i", pfile, "--forward"],
                  cwd="pkgsrc", capture_output=True, text=True,
              )
              if result.returncode == 0:
                  print(f"applied {patch['filename']}")
              else:
                  print(f"WARN: {patch['filename']} did not apply cleanly")
          PY

      - name: Build pure-Python wheel (pip wheel)
        if: matrix.build_type == 'pure_python'
        run: |
          python -m pip install --upgrade pip
          PKGSRC="${{ github.workspace }}/pkgsrc"
          if [ ! -d "$PKGSRC" ]; then
            echo "ERROR: $PKGSRC does not exist." >&2
            ls -la "${{ github.workspace }}" >&2
            exit 1
          fi
          python -m pip wheel --no-deps --wheel-dir wheelhouse "$PKGSRC"

      # Recipe-driven env vars are only injected into $GITHUB_ENV when
      # non-empty. Empty strings would be seen by cibuildwheel as "run an
      # empty script" and can trip it in some versions.
      - name: Export recipe environment (only when populated)
        if: >-
          matrix.build_type == 'cibuildwheel' &&
          (matrix.cibw_before_all != '' ||
           matrix.cibw_before_all_linux != '' ||
           matrix.cibw_environment_string != '')
        shell: bash
        run: |
          if [ -n "${{ matrix.cibw_before_all }}" ]; then
            printf 'CIBW_BEFORE_ALL=%s\n' "${{ matrix.cibw_before_all }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ matrix.cibw_before_all_linux }}" ]; then
            printf 'CIBW_BEFORE_ALL_LINUX=%s\n' "${{ matrix.cibw_before_all_linux }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ matrix.cibw_environment_string }}" ]; then
            printf 'CIBW_ENVIRONMENT=%s\n' "${{ matrix.cibw_environment_string }}" >> "$GITHUB_ENV"
          fi

      # Matches the older release workflow that successfully built Android
      # wheels for selectolax, primp, etc.:
      #   - cibuildwheel v4.2.0 (not v4.3.5)
      #   - CIBW_ENABLE: cpython-prerelease  (required for cp314)
      #   - CIBW_SKIP: cp31?t-*              (skip free-threaded builds)
      #   - No manual ANDROID_HOME / ANDROID_NDK_HOME override
      - name: Build dependency wheel (cibuildwheel)
        if: matrix.build_type == 'cibuildwheel'
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: pkgsrc
          output-dir: wheelhouse
        env:
          CIBW_PLATFORM: ${{ matrix.cibw_platform }}
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENABLE: cpython-prerelease
          CIBW_SKIP: cp31?t-*
          CIBW_BUILD_VERBOSITY: "1"
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          MACOSX_DEPLOYMENT_TARGET: >-
            ${{ matrix.cibw_platform == 'macos' && '14.0' || '' }}

      - name: Upload generated wheels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-wheels-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: warn
          retention-days: 30


  # ------------------------------------------------------------------
  # Verify: reconcile plan with produced/prebuilt wheels
  # ------------------------------------------------------------------
  verify:
    name: Verify generated dependency wheels
    needs: [plan, build]
    if: >-
      always() &&
      (needs.plan.outputs.has_builds == 'true' ||
       needs.plan.outputs.has_prebuilt == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "packaging>=25.0"

      - uses: actions/download-artifact@v4
        with:
          name: wheel-build-metadata
          path: metadata

      - run: mkdir -p all-wheels

      - name: Download built wheels
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: dependency-wheels-*
          path: all-wheels
          merge-multiple: true

      - name: Download prebuilt external wheels
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-wheels
          path: all-wheels

      - name: Verify wheels against build plan
        run: |
          python .github/scripts/verify_wheels.py \
            --wheel-dir all-wheels \
            --plan metadata/wheel-build-plan.json \
            --output wheel-verification.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-verification-report
          path: wheel-verification.json
          if-no-files-found: warn
          retention-days: 30


  # ------------------------------------------------------------------
  # Bundle: reproducible zips with manifest + SHA256
  # ------------------------------------------------------------------
  bundle:
    name: Create dependency wheel bundles
    needs: [plan, verify]
    if: >-
      needs.verify.result == 'success' &&
      (needs.plan.outputs.has_builds == 'true' ||
       needs.plan.outputs.has_prebuilt == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "packaging>=25.0"

      - name: Prepare wheel directories
        run: |
          mkdir -p built-wheels prebuilt-wheels bundles

      - name: Download built wheels
        if: needs.plan.outputs.has_builds == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: dependency-wheels-*
          path: built-wheels
          merge-multiple: true

      - name: Download prebuilt external wheels
        if: needs.plan.outputs.has_prebuilt == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-wheels
          path: prebuilt-wheels

      - uses: actions/download-artifact@v4
        with:
          name: wheel-verification-report
          path: verification

      - name: Bundle built wheels (dependency-wheels.zip)
        if: needs.plan.outputs.has_builds == 'true'
        run: |
          python .github/scripts/bundle_wheels.py \
            --wheel-dir built-wheels \
            --project-file pyproject.toml \
            --verification-report verification/wheel-verification.json \
            --output bundles/dependency-wheels.zip

      - name: Bundle prebuilt wheels (dependency-wheels-prebuilt.zip)
        if: needs.plan.outputs.has_prebuilt == 'true'
        run: |
          python .github/scripts/bundle_wheels.py \
            --wheel-dir prebuilt-wheels \
            --project-file pyproject.toml \
            --verification-report verification/wheel-verification.json \
            --output bundles/dependency-wheels-prebuilt.zip

      - name: Upload dependency-wheels bundle
        if: needs.plan.outputs.has_builds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-wheels
          path: bundles/dependency-wheels.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload dependency-wheels-prebuilt bundle
        if: needs.plan.outputs.has_prebuilt == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-wheels-prebuilt
          path: bundles/dependency-wheels-prebuilt.zip
          if-no-files-found: error
          retention-days: 90


  # ------------------------------------------------------------------
  # Policy: optional strict-mode failure
  # ------------------------------------------------------------------
  policy:
    name: Deferred build policy
    needs: [plan, build, verify, bundle]
    if: always() && inputs.fail_on_deferred == true
    runs-on: ubuntu-latest

    steps:
      - name: Enforce strict build policy
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REJECTED_COUNT: ${{ needs.plan.outputs.rejected_count }}
        run: |
          echo "Plan: ${PLAN_RESULT} / Build: ${BUILD_RESULT} / Verify: ${VERIFY_RESULT}"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Build planning did not succeed."; exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ]; then
            echo "::error::One or more wheel build jobs failed."; exit 1
          fi
          if [ "$VERIFY_RESULT" = "failure" ]; then
            echo "::error::Wheel verification failed."; exit 1
          fi
          if [ "${REJECTED_COUNT:-0}" != "0" ]; then
            echo "::error::Some wheel combinations were rejected or deferred."; exit 1
          fi
          echo "Strict build policy passed."