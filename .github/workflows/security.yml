# security.yml
name: Security and dependency audit (reusable)

on:
  workflow_call:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit resolved dependencies (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked project and development dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Audit installed dependencies
        # --strict makes unresolved / skipped dependencies a failure, not a note.
        run: uv run --locked --python ${{ matrix.python-version }} --with pip-audit pip-audit --strict