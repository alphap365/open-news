name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # No `environment` here, so running this job never creates a deployment.
  check-channel:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
    steps:
      - name: Classify release and guard against channel/tag mismatch
        id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'EOF'
          import os, re, sys

          tag = os.environ["TAG"]
          ui_prerelease = os.environ["IS_PRERELEASE"] == "true"
          version = tag.lstrip("v")

          tag_is_pre = bool(re.search(r"(a|b|rc)\d+|\.dev\d+", version))

          if tag_is_pre != ui_prerelease:
              print(
                  f"Refusing: tag {tag} implies pre-release={tag_is_pre} "
                  f"but release UI says prerelease={ui_prerelease}",
                  file=sys.stderr,
              )
              sys.exit(1)

          publish = "false" if tag_is_pre else "true"
          if tag_is_pre:
              print(f"{tag} is a pre-release - handled by the manual pre-release workflow.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"publish={publish}\n")
          EOF

  publish:
    needs: check-channel
    # Job-level condition: for pre-releases this job is skipped entirely,
    # so no deployment is recorded for the `pypi` environment.
    if: needs.check-channel.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/open-news-api
    steps:
      - name: Download only PyPI-eligible assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --repo ${{ github.repository }} \
            --pattern 'open_news_api-*' \
            --dir dist/

      - name: Sanity check - nothing unexpected in dist/
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No matching assets found in release - aborting." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$(basename "$f")" in
              open_news_api-*) ;;
              *) echo "Refusing to publish unexpected file: $f" >&2; exit 1 ;;
            esac
          done
          echo "Verified dist/ contents:"
          ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1