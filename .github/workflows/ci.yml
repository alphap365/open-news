name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and verify distributions
    uses: ./.github/workflows/build.yml

  security:
    name: Dependency audit
    uses: ./.github/workflows/security.yml

  workflow-check:
    name: Workflow policy and syntax
    uses: ./.github/workflows/workflow-check.yml

  result-summary:
    name: Required verification summary
    if: ${{ always() }}
    needs: [tests, build, security, workflow-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report verification results and enforce fail-closed status
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Open News CI result"
            echo
            echo "| Required check | Result |"
            echo "|---|---|"
            echo "| Tests | ${TESTS_RESULT} |"
            echo "| Build and artifact verification | ${BUILD_RESULT} |"
            echo "| Dependency audit | ${SECURITY_RESULT} |"
            echo "| Workflow policy | ${WORKFLOW_RESULT} |"
            echo
            echo "[Open full workflow run](${RUN_URL})"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$TESTS_RESULT" "$BUILD_RESULT" "$SECURITY_RESULT" "$WORKFLOW_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Required verification failed, was cancelled, or did not complete. Merge/release must remain blocked." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All required verification jobs passed. This CI workflow does not publish packages." | tee -a "$GITHUB_STEP_SUMMARY"
