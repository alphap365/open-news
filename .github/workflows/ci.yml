name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --python ${{ matrix.python-version }} --group mcp

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check src tests

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} ty check --python-version 3.10 --ignore import-not-found src/open_news

      - name: Check version agreement
        run: uv run --python ${{ matrix.python-version }} python .github/scripts/check_version.py

      - name: Compile package
        run: uv run --python ${{ matrix.python-version }} python -m compileall -q src/open_news

  build-check:
    name: Build sanity check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uv run --python 3.12 --with twine twine check dist/*