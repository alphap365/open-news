# Automatic PR / push gate.
# Tests oldest and newest supported Python, builds distributions, audits deps.
# No side effects — safe to re-run anytime.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported — the two versions that expose the
        # most regressions. Widen only when a real inter-version bug shows up.
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: fail if uv.lock disagrees with pyproject.toml,
      # instead of silently re-resolving on the runner.
      - name: Install project (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q

      - name: Compile package
        run: uv run --locked --python ${{ matrix.python-version }} python -m compileall -q open_news

  build:
    name: Build sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uv run --with twine twine check dist/*

      - name: Reject unexpected files in dist/
        run: |
          extra=$(find dist -maxdepth 1 -type f \
            ! -name '*.whl' ! -name '*.tar.gz' ! -name '*.zip' | wc -l)
          if [ "$extra" -ne 0 ]; then
            echo "Unexpected files in dist/:" >&2
            ls -la dist/ >&2
            exit 1
          fi

      - name: Install wheel in a clean venv
        run: |
          rm -rf /tmp/wheel-test
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/python -c "import open_news"
          /tmp/wheel-test/bin/open-news --help

      - name: Install sdist in a clean venv
        run: |
          rm -rf /tmp/sdist-test
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/pip install dist/*.tar.gz
          /tmp/sdist-test/bin/python -c "import open_news"
          /tmp/sdist-test/bin/open-news --help

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (locked)
        run: uv sync --locked

      # --strict: unresolved or skipped deps are failures, not notes.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --strict

  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: No production PyPI upload destination in any workflow
        run: |
          # Matches production PyPI upload endpoints only: the legacy upload
          # path on pypi.org / upload.pypi.org, or a repository-url override
          # pointing at production PyPI.
          #
          # Does not match (all safe):
          #   - test.pypi.org's legacy upload path       (TestPyPI)
          #   - pypi.org's read-only JSON API            (release/wheel checks)
          #   - environment display URLs                 (url:, not repository-url:)
          #   - comments (like this one) that don't include a matching URL
          #
          # Known gap: pypa/gh-action-pypi-publish with no explicit
          # repository-url defaults to production and cannot be caught by
          # grep. Compensating control is the 'pypi' environment's required-
          # reviewer gate, which fires on any deployment to that environment.
          if grep -rEin \
              "https://(upload\.)?pypi\.org/legacy|repository-url:[[:space:]]+[\"']?https://(upload\.)?pypi\.org" \
              .github/workflows/; then
            echo "ERROR: production PyPI upload destination is forbidden on this branch." >&2
            exit 1
          fi
          echo "OK: no production PyPI upload destination found."