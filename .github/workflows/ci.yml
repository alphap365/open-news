name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Compile package
        run: uv run --locked python -m compileall -q open_news

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Check artifacts
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1

      - name: Test wheel installation
        run: |
          python -m venv /tmp/test-wheel
          /tmp/test-wheel/bin/pip install dist/*.whl
          /tmp/test-wheel/bin/python -c "import open_news"

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Audit dependencies
        run: |
          uv export --locked \
            --format requirements-txt \
            --no-emit-project \
            --output-file /tmp/requirements.txt

          uv run --with pip-audit pip-audit \
            -r /tmp/requirements.txt

  policy:
    name: Workflow policy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Block production PyPI uploads
        run: |
          if grep -rEin \
            'https://(upload\.)?pypi\.org/legacy' \
            .github/workflows/; then
            echo "Production PyPI upload destination detected."
            exit 1
          fi