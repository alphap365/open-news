name: Workflow checks (reusable)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate GitHub Actions configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install and run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Enforce release and permission policy
        run: python .github/scripts/check_workflow_policy.py
