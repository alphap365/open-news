[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-news-api"
version = "1.0.3a6"
description = "Minimal news fetching: article text, RSS, Google News search, RSS discovery"
readme = "README.md"
authors = [{name = "ARAJIT PAUL", email = "arajitpaul2010@gmail.com"}]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
keywords = ["news", "rss", "google-news", "article-extraction", "feedparser", "newspaper"]
dependencies = [
    "lxml",
    "python-dateutil",
    "httpx",
    "beautifulsoup4",
    "feedparser",
    "googlenewsdecoder",
    "requests",
    "ddgs",
    "langdetect",
    "duckpy"
]

[project.urls]
Homepage = "https://github.com/alphap365/open-news"

[project.scripts]
open-news = "open_news.cli:main"
open-news-tui = "open_news.tui:run_tui"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["open_news*"]

[tool.setuptools.package-data]
open_news = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-vcr>=1.0",
    "respx>=0.20",
    "tox>=4.0",
    "pytest-mock>=3.0",
]

[project.optional-dependencies]
js = ["playwright>=1.40.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-vcr>=1.0",
    "respx>=0.20",
    "tox>=4.0",
    "pytest-mock>=3.0",
]
