[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-news"
version = "0.1.1"
description = "Minimal news fetching: article text, RSS, Google News search, RSS discovery"
readme = "README.md"
authors = [{name = "ARAJIT PAUL", email = "dev.arajit.2010@gmail.com"}]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
requires-python = ">=3.7"
keywords = ["news", "rss", "google-news", "article-extraction", "feedparser", "newspaper"]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/alphap365/open-news"

[tool.setuptools]
include-package-data = true
packages = ["open_news"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
open_news = ["py.typed"]
