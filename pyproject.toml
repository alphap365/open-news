[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-news-api"
version = "1.0.7b1"
description = "Minimal news fetching: article text, RSS, Google News search, RSS discovery"
readme = "README.md"
authors = [{name = "ARAJIT PAUL", email = "arajitpaul2010@gmail.com"}]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
keywords = ["news", "rss", "google-news", "article-extraction", "feedparser", "newspaper"]
dependencies = [
    "lxml",
    "python-dateutil",
    "httpx",
    "beautifulsoup4",
    "feedparser",
    "ddgs",
    "langdetect",
    "cryptography",
]

[project.urls]
Homepage = "https://github.com/alphap365/open-news"

[project.scripts]
open-news = "open_news.cli:main"
open-news-mcp = "open_news.mcp:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_news*"]

[tool.setuptools.package-data]
open_news = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
import-not-found = "ignore"

[tool.ty.src]
include = ["src/open_news"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-vcr>=1.0",
    "respx>=0.20",
    "tox>=4.0",
    "pytest-mock>=3.0",
    "cibuildwheel",
    "tomli>=2.0; python_version < '3.11'",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
js = [
    "playwright>=1.40.0"
]

nlp = [
    "sumy>=0.10.0",
    "bm25s>=0.3.10",
]

mcp = ["fastmcp>=2.0.0"]

all = [
    {include-group = "dev"},
    {include-group = "js"},
    {include-group = "nlp"},
    {include-group = "mcp"}
]

[project.optional-dependencies]
js = [
    "playwright>=1.40.0"
]

nlp = [
    "sumy>=0.10.0",
    "bm25s>=0.3.10",
]

mcp = ["fastmcp>=2.0.0"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
